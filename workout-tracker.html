<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="The Split">
<title>The Split — Weekly Training Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17140f;
    --bg-2:#1c1811;
    --surface:#211c15;
    --surface-2:#2a2318;
    --line: rgba(243,239,231,0.08);
    --line-strong: rgba(243,239,231,0.14);
    --text:#f3efe7;
    --muted:#9c9484;
    --muted-2:#6f6858;
    --iron:#d6522f;
    --iron-dim: rgba(214,82,47,0.16);
    --brass:#c9a24b;
    --radius: 14px;
    --radius-sm: 9px;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(214,82,47,0.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
    min-height:100vh;
  }

  .display{font-family:'Big Shoulders Display', sans-serif; font-weight:800; letter-spacing:0.01em;}

  /* header */
  header{
    padding: calc(22px + env(safe-area-inset-top)) 20px 16px;
    position: sticky;
    top:0;
    z-index: 20;
    background: linear-gradient(180deg, var(--bg) 60%, rgba(23,20,15,0.85) 85%, transparent);
    backdrop-filter: blur(6px);
  }
  .brand-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 4px;
  }
  .brand{
    font-size: 30px;
    line-height: 1;
    color: var(--text);
  }
  .brand span{color: var(--iron);}
  .week-tag{
    font-size: 12px;
    color: var(--muted);
    font-weight:500;
  }
  .subtitle{
    color: var(--muted);
    font-size: 13.5px;
    margin-top: 2px;
  }

  /* week progress strip */
  .week-strip{
    display:flex;
    gap:6px;
    margin-top:16px;
  }
  .week-dot{
    flex:1;
    height:5px;
    border-radius:3px;
    background: var(--line);
    overflow:hidden;
    position:relative;
  }
  .week-dot i{
    display:block;
    height:100%;
    width:0%;
    background: var(--iron);
    border-radius:3px;
    transition: width .35s ease;
  }
  .week-dot.rest{ background: transparent; border: 1px dashed var(--line-strong); }

  /* day tabs */
  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-top:16px;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex: 0 0 auto;
    padding: 9px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:7px;
    white-space:nowrap;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab .pct{
    font-size:11px;
    font-weight:700;
    color: var(--muted-2);
    background: rgba(0,0,0,0.25);
    padding: 1px 6px;
    border-radius:999px;
  }
  .tab.active{
    background: var(--iron);
    border-color: var(--iron);
    color: #1a0f0a;
  }
  .tab.active .pct{ background: rgba(0,0,0,0.18); color:#1a0f0a; }
  .tab.done{ border-color: rgba(214,82,47,0.5); }

  main{ padding: 18px 20px 10px; max-width: 640px; margin: 0 auto; }

  .day-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .day-head h1{
    font-size: 34px;
    margin:0;
    line-height:1;
  }
  .day-head .muscle{
    color: var(--muted);
    font-size: 14px;
    margin-top:6px;
    font-weight:500;
  }
  .ring-wrap{ position:relative; width:56px; height:56px; flex:0 0 auto; }
  .ring-wrap svg{ transform: rotate(-90deg); }
  .ring-track{ fill:none; stroke: var(--line); stroke-width: 5; }
  .ring-fill{ fill:none; stroke: var(--iron); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
  .ring-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size: 12px; font-weight:700; color: var(--text);
  }

  .section{ margin-bottom: 22px; }
  .section-title{
    font-size: 12.5px;
    font-weight:600;
    color: var(--muted-2);
    margin: 0 0 8px 2px;
  }

  .row{
    display:flex;
    align-items:center;
    gap:13px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 13px 14px;
    margin-bottom:8px;
    cursor:pointer;
    user-select:none;
    transition: background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .row:active{ background: var(--surface-2); }
  .row.checked{
    border-color: rgba(214,82,47,0.35);
    background: var(--iron-dim);
  }
  .checkbox{
    flex: 0 0 auto;
    width: 24px; height:24px;
    border-radius: 7px;
    border: 1.5px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center;
    background: rgba(0,0,0,0.2);
    transition: background .15s ease, border-color .15s ease, transform .15s ease;
  }
  .row.checked .checkbox{
    background: var(--iron);
    border-color: var(--iron);
    transform: scale(1.04);
  }
  .checkbox svg{
    width:14px; height:14px;
    opacity:0;
    transform: scale(0.6);
    transition: opacity .15s ease, transform .15s ease;
  }
  .row.checked .checkbox svg{ opacity:1; transform: scale(1); }

  .row-text{ flex:1; min-width:0; }
  .ex-name{
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    transition: color .15s ease, text-decoration-color .15s ease;
  }
  .row.checked .ex-name{ color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted-2); text-decoration-thickness: 1.5px; }
  .ex-meta{
    font-size: 12.5px;
    color: var(--muted-2);
    margin-top: 2px;
  }

  .rest-card{
    text-align:center;
    padding: 60px 24px 40px;
    color: var(--muted);
  }
  .rest-card .display{ font-size: 44px; color: var(--text); display:block; margin-bottom: 8px; }

  .footer-actions{
    display:flex;
    gap:10px;
    margin-top: 8px;
  }
  .btn-ghost{
    flex:1;
    text-align:center;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
    font-weight:600;
    background:transparent;
    cursor:pointer;
  }
  .btn-ghost:active{ background: var(--surface); }

  .toast{
    position: fixed;
    left:50%; bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(10px);
    background: var(--surface-2);
    border:1px solid var(--line-strong);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 50;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="brand display">the <span>split</span></div>
    <div class="week-tag" id="weekTag"></div>
  </div>
  <div class="subtitle" id="weekSummary">Loading week…</div>
  <div class="week-strip" id="weekStrip"></div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="main"></main>

<div class="toast" id="toast"></div>

<script>
// ---------- data ----------
const PLAN = [
  {
    key: 'mon', label: 'Monday', short: 'Mon',
    title: 'Shoulders & Arms',
    sections: [
      { title: 'Front & overhead', items: [
        { name: 'Front cable raise' },
        { name: 'Overhead cable press' },
      ]},
      { title: 'Lateral', items: [
        { name: 'Strict cable lateral raise' },
        { name: 'Lateral raise burnout', meta: '40 + 50 reps' },
      ]},
      { title: 'Rear delt', items: [
        { name: 'Face pull' },
        { name: 'Rear delt fly' },
      ]},
      { title: 'Arms', items: [
        { name: 'Bicep — cross-body hammer curl' },
        { name: 'Tricep — single-arm cable extension' },
      ]},
    ]
  },
  {
    key: 'tue', label: 'Tuesday', short: 'Tue',
    title: 'Legs I — Calves & Quads',
    sections: [
      { title: 'Calves', items: [
        { name: 'Seated calf raise' },
        { name: 'Smith machine calf raise' },
      ]},
      { title: 'Quads', items: [
        { name: 'Leg extension' },
        { name: 'Bulgarian split squat' },
      ]},
      { title: 'Hamstrings', items: [
        { name: 'Romanian deadlift' },
      ]},
      { title: 'Glutes', items: [
        { name: 'Hip thrust' },
      ]},
      { title: 'Core', items: [
        { name: 'Abs' },
      ]},
    ]
  },
  {
    key: 'wed', label: 'Wednesday', short: 'Wed',
    title: 'Back & Triceps',
    sections: [
      { title: 'Back — upper, lower, middle', items: [
        { name: 'Warm-up pull-up' },
        { name: 'Lat pulldown' },
        { name: 'Seated cable row' },
        { name: 'Lower back extension' },
      ]},
      { title: 'Triceps', items: [
        { name: 'Overhead cable extension' },
        { name: 'Cable pushdown' },
      ]},
    ]
  },
  {
    key: 'thu', label: 'Thursday', short: 'Thu',
    title: 'Chest & Biceps',
    sections: [
      { title: 'Chest', items: [
        { name: 'Incline press' },
        { name: 'Chest fly' },
        { name: 'Low cable fly' },
      ]},
      { title: 'Biceps', items: [
        { name: 'Strict bicep curl' },
        { name: 'Incline bench curl' },
      ]},
    ]
  },
  {
    key: 'fri', label: 'Friday', short: 'Fri',
    title: 'Legs II — Hams, Quads & Glutes',
    sections: [
      { title: 'Hamstrings', items: [
        { name: 'Romanian deadlift' },
        { name: 'Hamstring curl' },
      ]},
      { title: 'Quads', items: [
        { name: 'Squats' },
      ]},
      { title: 'Calves', items: [
        { name: 'Calf raise' },
      ]},
      { title: 'Glutes', items: [
        { name: 'Hip thrust' },
        { name: 'Goblet squat' },
      ]},
    ]
  },
  {
    key: 'sat', label: 'Saturday', short: 'Sat',
    title: 'Back & Chest',
    sections: [
      { title: 'Back — upper & middle', items: [
        { name: 'Cable row, wide grip' },
        { name: 'Barbell row' },
      ]},
      { title: 'Chest — upper & flat', items: [
        { name: 'Incline press' },
        { name: 'Flat bench press' },
      ]},
    ]
  },
  {
    key: 'sun', label: 'Sunday', short: 'Sun',
    title: 'Rest',
    rest: true,
    sections: []
  },
];

// ---------- storage ----------
function isoWeekKey(d){
  const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = (date.getUTCDay() + 6) % 7;
  date.setUTCDate(date.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(date.getUTCFullYear(),0,4));
  const week = 1 + Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay()+6)%7)) / 7);
  return date.getUTCFullYear() + '-W' + String(week).padStart(2,'0');
}
const WEEK_KEY = isoWeekKey(new Date());
const STORAGE_KEY = 'split-log:' + WEEK_KEY;

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveState(state){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();

function exId(dayKey, sIdx, iIdx){ return dayKey + ':' + sIdx + ':' + iIdx; }

function dayTotals(day){
  let total = 0, done = 0;
  day.sections.forEach((s, si) => s.items.forEach((it, ii) => {
    total++;
    if (state[exId(day.key, si, ii)]) done++;
  }));
  return { total, done };
}

// ---------- rendering ----------
const todayIdx = (new Date().getDay() + 6) % 7; // Monday=0
let activeIdx = todayIdx;

const tabsEl = document.getElementById('tabs');
const mainEl = document.getElementById('main');
const stripEl = document.getElementById('weekStrip');
const weekTagEl = document.getElementById('weekTag');
const summaryEl = document.getElementById('weekSummary');
const toastEl = document.getElementById('toast');

function fmtWeekTag(){
  const now = new Date();
  const start = new Date(now);
  start.setDate(now.getDate() - ((now.getDay()+6)%7));
  const end = new Date(start); end.setDate(start.getDate()+6);
  const opts = { month:'short', day:'numeric' };
  return start.toLocaleDateString('en-US', opts) + ' – ' + end.toLocaleDateString('en-US', opts);
}
weekTagEl.textContent = fmtWeekTag();

function renderTabs(){
  tabsEl.innerHTML = '';
  PLAN.forEach((day, idx) => {
    const t = dayTotals(day);
    const btn = document.createElement('div');
    btn.className = 'tab' + (idx===activeIdx ? ' active' : '') + (!day.rest && t.total>0 && t.done===t.total ? ' done' : '');
    const label = document.createElement('span');
    label.textContent = day.short;
    btn.appendChild(label);
    if (!day.rest){
      const pct = document.createElement('span');
      pct.className = 'pct';
      pct.textContent = t.done + '/' + t.total;
      btn.appendChild(pct);
    }
    btn.addEventListener('click', () => { activeIdx = idx; render(); });
    tabsEl.appendChild(btn);
  });
}

function renderStrip(){
  stripEl.innerHTML = '';
  PLAN.forEach((day) => {
    const dot = document.createElement('div');
    dot.className = 'week-dot' + (day.rest ? ' rest' : '');
    if (!day.rest){
      const t = dayTotals(day);
      const fill = document.createElement('i');
      fill.style.width = (t.total ? Math.round((t.done/t.total)*100) : 0) + '%';
      dot.appendChild(fill);
    }
    stripEl.appendChild(dot);
  });
  const totals = PLAN.filter(d=>!d.rest).reduce((acc,d)=>{
    const t = dayTotals(d); acc.total += t.total; acc.done += t.done; return acc;
  }, {total:0, done:0});
  const pct = totals.total ? Math.round((totals.done/totals.total)*100) : 0;
  summaryEl.textContent = totals.done + ' of ' + totals.total + ' lifts done this week — ' + pct + '%';
}

function ringSVG(pct){
  const r = 23, c = 2*Math.PI*r;
  const offset = c * (1 - pct);
  return `<svg width="56" height="56" viewBox="0 0 56 56">
    <circle class="ring-track" cx="28" cy="28" r="${r}"></circle>
    <circle class="ring-fill" cx="28" cy="28" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
  </svg>`;
}

function checkIcon(){
  return `<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.7L13 4.5" stroke="#1a0f0a" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 1400);
}

function renderMain(){
  const day = PLAN[activeIdx];
  mainEl.innerHTML = '';

  if (day.rest){
    const card = document.createElement('div');
    card.className = 'rest-card';
    card.innerHTML = `<span class="display">rest</span>No training today. Eat, sleep, recover — back at it Monday.`;
    mainEl.appendChild(card);
    return;
  }

  const t = dayTotals(day);
  const pct = t.total ? t.done/t.total : 0;

  const head = document.createElement('div');
  head.className = 'day-head';
  head.innerHTML = `
    <div>
      <h1 class="display">${day.label}</h1>
      <div class="muscle">${day.title}</div>
    </div>
    <div class="ring-wrap">
      ${ringSVG(pct)}
      <div class="ring-label">${t.done}/${t.total}</div>
    </div>
  `;
  mainEl.appendChild(head);

  day.sections.forEach((section, sIdx) => {
    const sec = document.createElement('div');
    sec.className = 'section';
    const h = document.createElement('div');
    h.className = 'section-title';
    h.textContent = section.title;
    sec.appendChild(h);

    section.items.forEach((item, iIdx) => {
      const id = exId(day.key, sIdx, iIdx);
      const checked = !!state[id];
      const row = document.createElement('div');
      row.className = 'row' + (checked ? ' checked' : '');
      row.innerHTML = `
        <div class="checkbox">${checkIcon()}</div>
        <div class="row-text">
          <div class="ex-name">${item.name}</div>
          ${item.meta ? `<div class="ex-meta">${item.meta}</div>` : ''}
        </div>
      `;
      row.addEventListener('click', () => {
        state[id] = !state[id];
        saveState(state);
        render();
        if (state[id]){
          const nt = dayTotals(day);
          if (nt.done === nt.total) showToast(day.label + ' complete 💪');
        }
      });
      sec.appendChild(row);
    });
    mainEl.appendChild(sec);
  });

  const actions = document.createElement('div');
  actions.className = 'footer-actions';
  const resetBtn = document.createElement('button');
  resetBtn.className = 'btn-ghost';
  resetBtn.textContent = 'Reset this day';
  resetBtn.addEventListener('click', () => {
    day.sections.forEach((s, si) => s.items.forEach((it, ii) => { delete state[exId(day.key, si, ii)]; }));
    saveState(state);
    render();
  });
  actions.appendChild(resetBtn);
  mainEl.appendChild(actions);
}

function render(){
  renderTabs();
  renderStrip();
  renderMain();
}

render();
</script>
</body>
</html>
